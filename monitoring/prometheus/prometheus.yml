global:
  scrape_interval: 30s
  evaluation_interval: 30s
  # Label added to all metrics so you can distinguish this Prometheus instance
  external_labels:
    monitor: 'erpnext-activity'

# Allow ActivityWatch historical data up to 7 days older than the head maxTime.
# Required because employees may push older events on first sync and Prometheus
# self-scraping advances the head timestamp.
# Note: out-of-order ingestion is always-on in Prometheus v2.51+ (no feature flag needed).
storage:
  tsdb:
    out_of_order_time_window: 365d

# No scrape targets needed here.
# All data arrives via Prometheus Remote Write pushed by aw-sync-agent
# running on each employee's computer.
#
# Data flows:
#   Employee PC → aw-sync-agent → Nginx (bearer token auth, port 9091)
#                                       → Prometheus /api/v1/write
#                                             → stored here
#   Grafana → reads from Prometheus (internal Docker network, port 9090)

scrape_configs:
  # Prometheus monitors itself — useful for debugging data flow
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
