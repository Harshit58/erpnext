version: '3.8'

services:
  grafana:
    image: grafana/grafana:10.4.3
    container_name: erpnext-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Pass DB credentials to provisioning
      - SITE1_DB_HOST=${SITE1_DB_HOST:-host.docker.internal}
      - SITE1_DB_PORT=${SITE1_DB_PORT:-3306}
      - SITE1_DB_NAME=${SITE1_DB_NAME}
      - SITE1_DB_USER=${SITE1_DB_USER}
      - SITE1_DB_PASSWORD=${SITE1_DB_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    extra_hosts:
      # Allows Docker container to reach MariaDB running on the host machine
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  grafana_data:
    driver: local
