version: '3.8'

services:

  # ── Grafana: admin dashboard ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: erpnext-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # ERPNext MariaDB credentials (for Phase 1 dashboards)
      - SITE1_DB_HOST=${SITE1_DB_HOST:-host.docker.internal}
      - SITE1_DB_PORT=${SITE1_DB_PORT:-3306}
      - SITE1_DB_NAME=${SITE1_DB_NAME}
      - SITE1_DB_USER=${SITE1_DB_USER}
      - SITE1_DB_PASSWORD=${SITE1_DB_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Prometheus: stores ActivityWatch metrics from all employee PCs ─────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: erpnext-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}"
      - "--web.enable-remote-write-receiver"   # accepts push from aw-sync-agent
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    # NOT exposed directly — only accessible via Nginx (with bearer token)

  # ── Nginx: secures Prometheus remote-write endpoint with bearer token ──────
  nginx:
    image: nginx:1.25-alpine
    container_name: erpnext-nginx
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PUBLIC_PORT:-9091}:9091"  # employee PCs push to this port
    environment:
      # Token is substituted into nginx.conf.template at container startup
      - PROMETHEUS_BEARER_TOKEN=${PROMETHEUS_BEARER_TOKEN}
    volumes:
      # nginx Docker image auto-runs envsubst on files in /etc/nginx/templates/
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge

volumes:
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
