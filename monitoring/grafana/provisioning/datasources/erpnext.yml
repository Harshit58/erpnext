apiVersion: 1

# Grafana automatically loads these datasources on startup.
# Credentials are injected from environment variables (set in .env).
# Phase 1: MariaDB datasources (ERPNext logs)
# Phase 2: Prometheus datasource (ActivityWatch from employee PCs)

datasources:
  - name: "ERPNext - tridevhealthcare-erp.nlinkits.com"
    uid: erpnext-site1
    type: mysql
    access: proxy
    url: "${SITE1_DB_HOST}:${SITE1_DB_PORT}"
    database: "${SITE1_DB_NAME}"
    user: "${SITE1_DB_USER}"
    secureJsonData:
      password: "${SITE1_DB_PASSWORD}"
    jsonData:
      maxOpenConns: 5
      maxIdleConns: 5
      connMaxLifetime: 14400
      connectionTimeout: 30
      tlsSkipVerify: true
    isDefault: true
    editable: false

  # ── Phase 2: Prometheus (ActivityWatch desktop tracking) ───────────────────
  - name: "Tridev Activity Watcher - Prometheus"
    uid: tridev-aw-prometheus
    type: prometheus
    access: proxy
    # Internal Docker network — Grafana talks directly to Prometheus container
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: "30s"
      httpMethod: POST

